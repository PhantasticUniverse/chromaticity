#
# workspace-hack crate (cargo-hakari pattern).
#
# The dependency block between the BEGIN / END HAKARI SECTION markers
# is fully managed by `cargo hakari generate` and MUST NOT be hand
# edited. The generator rewrites the section in place; adding or
# removing lines outside the markers is fine.
#
# Hakari configuration lives at /.config/hakari.toml; see also
# docs/43-development-standards.md §10.5.

[package]
name = "workspace-hack"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "workspace-hack crate managed by cargo-hakari."

[lints]
workspace = true

### BEGIN HAKARI SECTION
