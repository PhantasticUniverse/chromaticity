#
# Chromaticity Rust workspace root.
# Shared defaults (edition, MSRV, license, rustc/clippy lints) live
# under [workspace.package] and [workspace.lints] and are inherited by
# member crates via `foo.workspace = true` in their own Cargo.toml.
# See docs/43-development-standards.md §12.1 and docs/adr/ADR-018.
#
# Member crates populate under engine/ and app/ subtrees matching
# CODEOWNERS (docs/43-development-standards.md §8). Phase-1 entry
# lands the Tauri shell at app/shell/; engine/runtime, engine/scene,
# engine/audio, integrations/, app/authoring/, app/library/, and
# app/ui/ arrive in subsequent PRs. workspace-hack sits at repo root
# per the cargo-hakari convention (it is not a product crate).

[workspace]
resolver = "3"
members = [
    "workspace-hack",
    "app/shell",
    "app/ui-bridge",
    "engine/runtime",
    "engine/scene",
    "engine/audio",
    "engine/entitlement",
    "engine/observability",
    "engine/render",
    "engine/script",
    "integrations/osc-adapter",
]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
license = "LicenseRef-Chromaticity-Proprietary"
publish = false

# Lints applied to every member crate. Member Cargo.toml opts in with
# `[lints] workspace = true`. See §12.1.
[workspace.lints.rust]
unsafe_code = "forbid"

# clippy::unwrap_used and clippy::expect_used are in the
# clippy::restriction group (not clippy::all) and must be opted into
# explicitly. They fire on non-test code only; test modules opt out
# with `#[cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used))]`
# at the module level per §12.1.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Redundant under the workspace-level unsafe_code = "forbid" above,
# but retained as a tripwire: if any subtree ever opts out of forbid
# per §12.6 (subtree-tightening-only, policy-scoped ADR required),
# missing_safety_doc keeps every unsafe block carrying a // SAFETY:
# doc comment that states the invariant being upheld. See
# docs/43 §12.1 for the forbid-as-floor posture.
missing_safety_doc = "deny"

# Release profile: small binary. Platform signing pipelines strip
# further (ADR-014).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
incremental = true

# cargo-hakari configuration lives at /.config/hakari.toml. The older
# `[workspace.metadata.hakari]` embedded form is not read by
# cargo-hakari 0.9.36 and must not be re-introduced here — having
# both locations invites silent drift.
