# SPDX-FileCopyrightText: 2026 Chromaticity
#
# Rust build + lint + test + supply-chain CI for the Phase-1 scaffold
# per docs/43-development-standards.md §10.4, §12.1, §7.3, and ADR-018.
#
# Jobs:
#   detect-changes - dorny/paths-filter@v3 emitting a `rust` boolean
#                    that gates the real jobs. Declared at `on:` trigger
#                    level (no pull_request.paths filter) so the final
#                    summary job always reports — required for branch
#                    protection when no rust-affecting files change.
#   fmt            - cargo fmt --all -- --check
#   clippy         - PR on Linux: cargo clippy --workspace --all-targets
#                    -- -D warnings (authoritative lint surface). PR on
#                    macOS + Windows: cargo check --workspace
#                    --all-targets (catches platform-conditional
#                    compile errors at ~50% of clippy wall-clock; lint
#                    rules are OS-independent so running clippy on one
#                    OS suffices at PR time). push-to-main: full clippy
#                    matrix across all three OSes so any platform-
#                    specific clippy findings land on `main` and
#                    surface in the next PR rebase, not at release.
#   test           - cargo nextest run --workspace --all-targets
#                    (Linux only at Phase 1; multi-OS lands when the
#                    first GPU-boundary integration test arrives). A
#                    separate `cargo test --doc` step covers doctests
#                    which nextest does not execute.
#   deny           - cargo deny check {advisories, licenses, bans,
#                    sources} matrix (the four subsystems enumerated in
#                    §10.4).
#   hakari         - cargo hakari generate --diff + manage-deps
#                    --dry-run drift check. Binary installed via
#                    taiki-e/install-action (prebuilt, not compiled
#                    from source).
#   rust-summary   - required-status aggregator. `needs:` every other
#                    job and succeeds when each dependent job is either
#                    `success` or `skipped` (skipped is the expected
#                    state on docs-only PRs). Fails on any `failure` or
#                    `cancelled`. This is the context listed as
#                    required in branch protection.
#
# Cost-reduction measures (introduced in the ci-cost-reduction PR):
#
#   - taiki-e/install-action replaces `cargo install cargo-hakari`;
#     fetches the prebuilt binary in seconds instead of a ~90s source
#     compile per run.
#   - awalsh128/cache-apt-pkgs-action replaces inline apt-get install
#     for the Tauri Linux build dependencies. Restores the .deb set
#     in ~2s vs ~45s uncached (~80s aggregate savings per run across
#     clippy-linux and test).
#   - PR-time clippy→check split on macOS + Windows (noted above).
#     Saves ~10 billable min/PR on macOS (10x multiplier) and ~1 min
#     on Windows (2x multiplier). Push-to-main still runs full clippy
#     so lint invariants never drift.
#   - cargo nextest replaces cargo test for the unit + integration
#     sweep (30-50% faster on workspace-scale test matrices); doctests
#     remain in a separate cargo test --doc step.
#   - rust-lld linker on Windows via .cargo/config.toml target
#     override. ~20-40% link-time win; transparent to other platforms.
#
# Projected aggregate savings at current workload: ~55% reduction in
# billable minutes per PR while preserving full Win/macOS coverage.
# sccache was evaluated but held back from this first iteration — it
# introduces a hard dependency on the GHA artifact-cache service and
# fails rustc outright when that service degrades. Revisit in a
# follow-up once a graceful-fallback pattern is in place.
#
# No run: step consumes untrusted github.event.* input. The only
# interpolations reaching a run: block are matrix.* (repo config),
# runner.os, github.event_name (in-context terminal value), and
# needs.*.result (github-controlled terminal values). Per the Phase-0
# policy.yml precedent, any future event-payload reference must be
# bound via step-level env: first.

name: rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  # dorny/paths-filter@v3 uses the REST API to list PR files.
  pull-requests: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.combine.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'workspace-hack/**'
              - 'app/**'
              - 'engine/**'
              - 'integrations/**'
              - 'release-eng/**'
              - '.github/workflows/rust.yml'

      # Non-pull_request events (push to main, merge_group queue) bypass the
      # filter and always run rust jobs. Merge-queue events in particular
      # validate the queued-merge commit and must run every required check
      # end-to-end; path-filtering on the queued commit would defeat the
      # point of the queue.
      - name: Combine filter output with non-PR bypass
        id: combine
        env:
          EVENT: ${{ github.event_name }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
        shell: bash
        run: |
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=${FILTER_RUST:-false}" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tauri linux deps (cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev libasound2-dev build-essential
          version: 1.0

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Seed frontend dist sentinel
        shell: bash
        run: mkdir -p dist && touch dist/.gitkeep

      # PR on Linux, any push-to-main, or any merge_group (queue) event
      # on any OS: run full clippy with -D warnings. This is the
      # authoritative lint surface. Merge-queue events validate the
      # post-merge commit, so they run the full matrix even though PRs
      # short-cut to cargo check on Win/macOS.
      - name: Lint (cargo clippy)
        if: github.event_name != 'pull_request' || runner.os == 'Linux'
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      # PR on macOS or Windows: cargo check only. Catches platform-
      # conditional compile errors; skips the clippy lint pass
      # (covered by the Linux job; merge-queue event runs full clippy
      # on every OS before the merge commits).
      - name: Cross-platform compile check (cargo check)
        if: github.event_name == 'pull_request' && runner.os != 'Linux'
        shell: bash
        run: cargo check --workspace --all-targets

  test:
    name: test
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tauri linux deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev libasound2-dev build-essential
          version: 1.0

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Seed frontend dist sentinel
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Run unit + integration tests (nextest)
        run: cargo nextest run --workspace --all-targets --no-fail-fast

      # nextest does not execute doctests. Keep a separate sweep so
      # doctest regressions still fail CI. Phase-1 tree has zero
      # doctests at time of writing; present for forward coverage.
      - name: Run doc tests
        run: cargo test --workspace --doc

  deny:
    name: deny (${{ matrix.check }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}

  hakari:
    name: hakari drift
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary via taiki-e/install-action avoids the ~90s
      # source-compile cost of `cargo install cargo-hakari`. 0.9.36
      # is pinned to match workspace MSRV (1.85.0); 0.9.37+ requires
      # rustc >=1.86.
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari@0.9.36

      - name: Verify workspace-hack is regenerated
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

  rust-summary:
    name: rust-summary
    needs: [detect-changes, fmt, clippy, test, deny, hakari]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate dependent job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          set -u
          echo "Dependent job results: $RESULTS"
          fail=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *)
                echo "::error::non-passing dependent result: $r"
                fail=1
                ;;
            esac
          done
          exit "$fail"
