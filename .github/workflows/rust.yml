#
# Rust build + lint + test + supply-chain CI for the Phase-1 scaffold
# per docs/43-development-standards.md §10.4, §12.1, and ADR-018.
#
# Jobs:
#   fmt    - cargo fmt --all -- --check
#   clippy - cargo clippy --workspace --all-targets -- -D warnings
#            (ubuntu + macos + windows)
#   test   - cargo test --workspace (Linux only at Phase 1; multi-OS
#            lands when the first GPU-boundary integration test
#            arrives)
#   deny   - cargo deny check {advisories, licenses, bans, sources}
#            matrix (the four subsystems enumerated in §10.4)
#   hakari - cargo hakari generate --diff + manage-deps --dry-run
#            drift check
#
# No run: step consumes untrusted github.event.* input; matrix.*
# and runner.os are the only interpolations and come from repo
# config, not PR-author-controlled payloads. Per the Phase-0
# policy.yml precedent, any future event-payload reference must
# be bound via step-level env: first.

name: rust

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'workspace-hack/**'
      - 'app/**'
      - 'engine/**'
      - 'integrations/**'
      - 'release-eng/**'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tauri linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Seed frontend dist sentinel
        shell: bash
        run: mkdir -p dist && touch dist/.gitkeep

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tauri linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Seed frontend dist sentinel
        run: mkdir -p dist && touch dist/.gitkeep

      - run: cargo test --workspace --all-targets --no-fail-fast

  deny:
    name: deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}

  hakari:
    name: hakari drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hakari
        run: cargo install cargo-hakari --locked

      - name: Verify workspace-hack is regenerated
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
