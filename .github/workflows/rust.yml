#
# Rust build + lint + test + supply-chain CI for the Phase-1 scaffold
# per docs/43-development-standards.md §10.4, §12.1, §7.3, and ADR-018.
#
# Jobs:
#   detect-changes - dorny/paths-filter@v3 emitting a `rust` boolean
#                    that gates the real jobs. Declared at `on:` trigger
#                    level (no pull_request.paths filter) so the final
#                    summary job always reports — required for branch
#                    protection when no rust-affecting files change.
#   fmt            - cargo fmt --all -- --check
#   clippy         - cargo clippy --workspace --all-targets -- -D warnings
#                    (ubuntu + macos + windows)
#   test           - cargo test --workspace (Linux only at Phase 1;
#                    multi-OS lands when the first GPU-boundary
#                    integration test arrives)
#   deny           - cargo deny check {advisories, licenses, bans,
#                    sources} matrix (the four subsystems enumerated in
#                    §10.4)
#   hakari         - cargo hakari generate --diff + manage-deps
#                    --dry-run drift check
#   rust-summary   - required-status aggregator. `needs:` every other
#                    job and succeeds when each dependent job is either
#                    `success` or `skipped` (skipped is the expected
#                    state on docs-only PRs). Fails on any `failure` or
#                    `cancelled`. This is the context listed as
#                    required in branch protection.
#
# No run: step consumes untrusted github.event.* input. The only
# interpolations reaching a run: block are matrix.* (repo config),
# runner.os, and needs.*.result (github-controlled terminal values).
# Per the Phase-0 policy.yml precedent, any future event-payload
# reference must be bound via step-level env: first.

name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter@v3 uses the REST API to list PR files.
  pull-requests: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'workspace-hack/**'
              - 'app/**'
              - 'engine/**'
              - 'integrations/**'
              - 'release-eng/**'
              - '.github/workflows/rust.yml'

  fmt:
    name: fmt
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tauri linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Seed frontend dist sentinel
        shell: bash
        run: mkdir -p dist && touch dist/.gitkeep

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tauri linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Seed frontend dist sentinel
        run: mkdir -p dist && touch dist/.gitkeep

      - run: cargo test --workspace --all-targets --no-fail-fast

  deny:
    name: deny (${{ matrix.check }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}

  hakari:
    name: hakari drift
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hakari
        # 0.9.37 requires rustc >=1.86; workspace MSRV is pinned to 1.85.0.
        run: cargo install cargo-hakari --version 0.9.36 --locked

      - name: Verify workspace-hack is regenerated
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

  rust-summary:
    name: rust-summary
    needs: [detect-changes, fmt, clippy, test, deny, hakari]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate dependent job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          set -u
          echo "Dependent job results: $RESULTS"
          fail=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *)
                echo "::error::non-passing dependent result: $r"
                fail=1
                ;;
            esac
          done
          exit "$fail"
