#
# Phase-0 policy checks.
#
# Enforces docs/43-development-standards.md on every PR and on pushes to
# `main`. No untrusted event payload is ever consumed in a `run:` body
# directly; every reference to `github.event.*`, `github.sha`,
# `github.ref`, or secrets is first bound to a step-level `env:` entry
# and consumed as a shell variable.
#
# Jobs:
#   - commit-convention-lint : EV-COMMIT-CONVENTION-LINT
#   - dco                    : Sec.9.2 DCO on every commit in the range
#   - trailer-check          : Sec.4.5 mandatory trailers
#   - codeowners-location    : Sec.8.1 CODEOWNERS location guard
#   - signed-commits         : Sec.9.1 cryptographic commit signatures
#   - reuse-lint             : EV-LICENSE-HEADERS
#   - adr-lint               : EV-ADR-LINT (only when docs/adr/ changed)
#   - secret-scan            : Sec.18.3 belt-and-suspenders
#
# Heavier checks (rust clippy, tsc, cargo-deny, SBOM) are added by the
# Phase-1 scaffold commit stream.

name: policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  # Match rust.yml + frontend.yml: only auto-cancel on PR events;
  # push (incl. squash-merge to main) + merge_group run to completion
  # so each merge commit's required-context bookkeeping lands cleanly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-convention-lint:
    name: commit-convention-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install commitlint
        run: |
          npm install --no-save \
            '@commitlint/cli@^19' \
            '@commitlint/config-conventional@^19' \
            '@commitlint/types@^19'

      # Full-body commitlint on branch commits during PR review —
      # author-written commit messages must conform to
      # body-max-line-length, footer-leading-blank, etc. On merge_group
      # events the range resolves to the queue's synthetic squash
      # commit whose body is the PR body (markdown), so full-body
      # linting is handled instead by the subject-only step below.
      - name: Lint commits in PR range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # PR-title lint only runs on pull_request events; merge_group has
      # no `title` field. The commit-range lint above already covers the
      # queued commit's subject because the queue's head commit carries
      # the PR title as its subject.
      - name: Lint PR title via file
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > .pr-title.txt
          npx commitlint --verbose < .pr-title.txt
          rm -f .pr-title.txt

      # Subject-only lint on push to main and on merge_group (queue) events.
      # The squash-merge commit body is composed from the PR body, which
      # is markdown and regularly violates body-max-line-length,
      # footer-max-line-length, and footer-leading-blank — rules that
      # make sense for hand-authored feature-branch commits but not for
      # PR-body-composed squash commits. The subject line still carries
      # the commitlint-enforced Conventional Commit shape, so type /
      # scope / case / length are still validated.
      - name: Lint head commit subject on push or merge_group
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        run: |
          git log -1 --format='%s' | npx commitlint --verbose

  dco:
    name: dco
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit in PR range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -eu
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              printf '::error::commit %s missing Signed-off-by trailer (DCO 1.1)\n' "$sha"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All commits carry a DCO Signed-off-by trailer."

  trailer-check:
    name: trailer-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On pull_request events actions/checkout resolves HEAD to
      # `refs/pull/<N>/merge` — a synthetic merge commit GitHub
      # generates whose message carries no DCO / Profile-Impact
      # trailers. Validating HEAD directly would always fail. Walk
      # the author-visible range instead so every commit the PR
      # adds is checked, and the merge commit is never inspected.
      # On merge_group events, actions/checkout resolves to the
      # queue-side commit which carries the PR body's trailers (per
      # the repo's squash template). Walking the range still works
      # because `merge_group.base_sha..merge_group.head_sha` resolves
      # to the same author-visible commits.
      - name: Validate trailers on every commit in PR range
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -eu
          fail=0
          while IFS= read -r sha; do
            bash scripts/trailer-check.sh "$sha" || fail=1
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$fail"

      # Pre-merge validation of the synthesised squash-merge commit
      # body on pull_request events. The repo's squash template is
      # "Default to pull request title and description" (confirmed
      # via `gh api repos/.../.squash_merge_commit_message` ==
      # `PR_BODY`), so the main-side commit body equals PR_BODY
      # verbatim with PR_TITLE as subject. Branch-commit trailers do
      # NOT survive the squash, so the range-walker above passes even
      # when the PR body carries no trailers at all. This step
      # reconstructs what will actually land on main and validates it
      # through the same trailer-check codepath so a missing
      # Profile-Impact or Signed-off-by is caught during the PR review
      # window rather than surfacing post-merge on the push-to-main
      # backstop below. PR #83 (merge commit 09a067d) is the
      # motivating incident: the PR body omitted Profile-Impact,
      # the range-walker passed, and `Validate HEAD on push to main`
      # failed after merge — leaving a red status on main's history
      # for a class of failure that belongs pre-merge.
      #
      # Untrusted-payload handling: PR_TITLE and PR_BODY are bound to
      # step-level env: entries and consumed only via `printf '%s'`
      # (never interpolated into command text), matching the
      # workflow-wide convention stated at the top of this file.
      - name: Validate synthesised squash-merge body on pull_request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | bash scripts/trailer-check.sh --stdin

      # Defense-in-depth on main-side commits. The squash-merge
      # commit body = PR body verbatim under the repo's squash
      # template, but multi-commit PRs pick up an auto-injected
      # cumulative Signed-off-by separated from the PR-body trailers
      # by a `---------` divider. A parser regression that lets
      # a bad shape slip would otherwise accumulate silently on
      # main; this step catches at merge time rather than on the
      # next PR that hits trailer-check. f6de2f5 motivated this
      # gap-close; 09a067d (PR #83) motivated the PR-event
      # synthesised-body step above that now fires BEFORE merge.
      - name: Validate HEAD on push to main
        if: github.event_name == 'push'
        run: bash scripts/trailer-check.sh HEAD

      # Regression harness for scripts/trailer-check.sh. Fixtures live
      # under tests/fixtures/trailer-check/; the driver is the sibling
      # scripts/test-trailer-check.sh. Runs on every event so the
      # prose-collision defenses, the divider-handling walker, and
      # the negative-path diagnostic are verified against each
      # toolchain and runner version the workflow lands on. No
      # untrusted input consumed; command is a static literal.
      - name: Run trailer-check regression harness
        run: bash scripts/test-trailer-check.sh

  codeowners-location:
    name: codeowners-location
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify root CODEOWNERS is authoritative
        shell: bash
        run: |
          set -euo pipefail
          test -f CODEOWNERS
          if [ -e .github/CODEOWNERS ] || [ -e docs/CODEOWNERS ]; then
            printf '::error::GitHub reads .github/CODEOWNERS before /CODEOWNERS; keep only the root file authoritative.\n'
            exit 1
          fi

      - name: Validate CODEOWNERS via GitHub parser
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/codeowners/errors?ref=$HEAD_SHA"
          )"

          error_count="$(printf '%s' "$response" | jq '.errors | length')"
          if [ "$error_count" -ne 0 ]; then
            printf '::error::CODEOWNERS has %s parse or owner-resolution error(s) at ref %s\n' "$error_count" "$HEAD_SHA"
            printf '%s\n' "$response" \
              | jq -r '.errors[] | "::error file=\(.source.path // "CODEOWNERS"),line=\(.source.line // 1),col=\(.source.column // 1)::\(.message)"'
            exit 1
          fi

          printf 'CODEOWNERS syntax and owner resolution are valid at %s.\n' "$HEAD_SHA"

  signed-commits:
    name: signed-commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GitHub commit signatures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            commits="$HEAD_SHA"
          else
            commits="$(git rev-list "$BASE_SHA..$HEAD_SHA")"
          fi

          fail=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            verification="$(
              curl --fail --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPOSITORY/commits/$sha" \
              | jq -r '.commit.verification | "\(.verified) \(.reason)"'
            )"
            if [ "$verification" != "true valid" ]; then
              printf '::error::commit %s is not GitHub-verified (%s)\n' "$sha" "$verification"
              fail=1
            fi
          done < <(printf '%s\n' "$commits")

          exit "$fail"

  reuse-lint:
    name: reuse-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run reuse lint
        uses: fsfe/reuse-action@v5

  adr-lint:
    name: adr-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes under docs/adr/
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          compare_base="${BEFORE_SHA:-$BASE_SHA}"
          if [ -z "${compare_base:-}" ] || [ "$compare_base" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only "$compare_base" "$HEAD_SHA" | grep -qE '^docs/adr/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Runs when docs/adr/ changed OR on any pull_request event.
      # PR-event runs are needed even without an adr/ diff so the
      # architecture-review gate can check the `architecture` label
      # and enforce the `[INDEPENDENT-ARCH-REVIEW]` tag on reviewer
      # comments per docs/43 Sec.7.4. The gate silently no-ops when
      # the label is absent, so non-architecture PRs pay only the
      # cost of the cheap ADR-files lint.
      - name: Run adr-lint
        if: steps.filter.outputs.changed == 'true' || github.event_name == 'pull_request'
        env:
          # Architecture-review gate (A5): fires only on PR events
          # and only on architecture-labeled PRs. Requires PR_NUMBER
          # + GITHUB_REPOSITORY + gh CLI (gh is pre-installed on
          # ubuntu-latest; the workflow token carries pull-requests:
          # read permission at the workflow level).
          ADR_LINT_REQUIRE_ARCH_REVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ADR-001..008 / 017 / 018 backfill has landed and grace-mode
          # warnings are now zero on main. Keep ADR_LINT_REQUIRE_EV_TRACE
          # unset until explicit AO sign-off authorizes promotion to
          # hard errors.
        run: bash scripts/adr-lint.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 computes a <before>^..<head> range that
      # fails to resolve when <before> is the initial commit of the
      # history (no parent exists). We invoke the CLI directly and
      # scan the full commit history, which is both simpler and
      # resilient to first-push / force-push / rebase edge cases.
      # No untrusted event payload is consumed in any run: block;
      # GITLEAKS_VERSION is a literal pinned string.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -eu
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks

      - name: Run gitleaks (full history)
        run: |
          set -eu
          /tmp/gitleaks/gitleaks detect \
            --redact \
            --report-format=sarif \
            --report-path=gitleaks.sarif \
            --log-level=info \
            --no-banner \
            --log-opts=--no-merges

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
