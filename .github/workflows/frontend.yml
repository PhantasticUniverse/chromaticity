#
# Frontend CI (TypeScript + Svelte 5) per docs/43-development-
# standards.md §12.2, §12.5, §7.3, and ADR-018. One check job runs
# prettier, eslint, tsc, and svelte-check in order; each step is
# blocking.
#
# Jobs:
#   detect-changes   - dorny/paths-filter@v3 emitting a `frontend`
#                      boolean that gates the real job. Declared at the
#                      `on:` trigger level (no pull_request.paths
#                      filter) so the frontend-summary job always
#                      reports — required for branch protection when
#                      no frontend-affecting files change.
#   check            - prettier, eslint, tsc, svelte-check.
#   frontend-summary - required-status aggregator. `needs:` every other
#                      job and succeeds when each dependent job is
#                      either `success` or `skipped` (skipped is the
#                      expected state on rust-only or docs-only PRs).
#                      Fails on any `failure` or `cancelled`.
#
# No run: step consumes untrusted github.event.* input. The only
# interpolations reaching a run: block are needs.*.result values,
# which are github-controlled terminal states.

name: frontend

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  # dorny/paths-filter@v3 uses the REST API to list PR files.
  pull-requests: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.combine.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            frontend:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'eslint.config.js'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'src/**'
              - 'index.html'
              - '.prettierrc.yaml'
              - '.prettierignore'
              - '.github/workflows/frontend.yml'

      # Non-pull_request events (push to main, merge_group queue) bypass
      # the filter and always run frontend jobs. Merge-queue events in
      # particular validate the queued-merge commit end-to-end.
      - name: Combine filter output with non-PR bypass
        id: combine
        env:
          EVENT: ${{ github.event_name }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        shell: bash
        run: |
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=${FILTER_FRONTEND:-false}" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check (app + build configs)
        run: npm run tsc

      - name: Svelte-check
        run: npm run check

  frontend-summary:
    name: frontend-summary
    needs: [detect-changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate dependent job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          set -u
          echo "Dependent job results: $RESULTS"
          fail=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *)
                echo "::error::non-passing dependent result: $r"
                fail=1
                ;;
            esac
          done
          exit "$fail"
