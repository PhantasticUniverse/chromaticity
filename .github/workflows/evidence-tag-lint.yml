#
# EV-EVIDENCE-TAG-COVERAGE gate per docs/26-evidence-artifact-
# registry.md and docs/43-development-standards.md §15.
#
# Required-check slot from Phase 1 onward (branch protection).
# The strict enforcement body has graduated (see the header of
# scripts/evidence-tag-lint.sh for the authoritative scope): the
# job fails on tier-less `//! Evidence:` tags, on Rust test files
# under engine/**, integrations/**, or app/shell/tests/** that
# lack an evidence declaration, and on EV-IDs absent from
# docs/26-evidence-artifact-registry.md.
#
# No run: step consumes untrusted github.event.* input.

name: evidence-tag-lint

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: evidence-tag-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: EV-EVIDENCE-TAG-COVERAGE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run evidence-tag-lint
        run: bash scripts/evidence-tag-lint.sh
