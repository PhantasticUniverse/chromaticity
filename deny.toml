#
# cargo-deny configuration. Wires the four subsystems enumerated in
# docs/43-development-standards.md §10.4. Each subsystem runs as a
# matrix job in .github/workflows/rust.yml invoking
# `cargo deny check <name>`.
#
#   advisories — deny-all remains the cargo-deny v2 behavior for now.
#                At Phase 1, several transitive crates pulled by Tauri's
#                desktop stack are flagged as unmaintained (plus adjacent
#                ecosystem advisories) with no direct safe upgrade path.
#                We keep CI stable by enumerating explicit IDs in
#                `advisories.ignore`; each should be revisited when Tauri
#                updates its dependency graph.
#   licenses   — SPDX allowlist sourced from
#                docs/29-cleanroom-legal-policy-baseline.md. Additions
#                require a coordinated `policy`-scoped PR editing both
#                this file and the cleanroom policy document.
#   sources    — First-party crates only; crates.io is the sole allowed
#                registry. Unknown git sources are denied.
#   bans       — Explicit banned crates per ADR-013 networking policy.
#                Empty at Phase-1 entry; populated as real direct
#                dependencies land.

[graph]
# Target all commonly-shipped host triples so transitive advisories on
# platform-gated deps are not silently excluded from the check. This
# list MUST stay in sync with the `platforms` list in
# /.config/hakari.toml; a `policy`-scoped PR that bumps one must bump
# the other (see docs/43-development-standards.md §10.5).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # gtk-rs GTK3 stack and closely related transitive crates currently
    # pulled by Tauri desktop dependencies (no safe direct upgrade path).
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # proc-macro-error advisory chain in transitive dependencies.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "LicenseRef-Chromaticity-Proprietary",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
