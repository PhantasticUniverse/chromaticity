#
# cargo-deny configuration. Wires the four subsystems enumerated in
# docs/43-development-standards.md §10.4. Each subsystem runs as a
# matrix job in .github/workflows/rust.yml invoking
# `cargo deny check <name>`.
#
#   advisories — security-significant findings are denied (`vulnerability`
#                and `yanked`), while `unmaintained` is warning-only.
#                Rationale: upstream Tauri GTK3 transitive crates are
#                currently flagged as unmaintained across Linux desktop
#                ecosystems; that is a supply-chain health signal, not a
#                direct exploit indicator. Keep warning visibility until
#                upstream migration lands; do not suppress via `ignore`
#                unless we need an explicit per-ID waiver trail.
#   licenses   — SPDX allowlist sourced from
#                docs/29-cleanroom-legal-policy-baseline.md. Additions
#                require a coordinated `policy`-scoped PR editing both
#                this file and the cleanroom policy document.
#   sources    — First-party crates only; crates.io is the sole allowed
#                registry. Unknown git sources are denied.
#   bans       — Explicit banned crates per ADR-013 networking policy.
#                Empty at Phase-1 entry; populated as real direct
#                dependencies land.

[graph]
# Target all commonly-shipped host triples so transitive advisories on
# platform-gated deps are not silently excluded from the check.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
vulnerability = "deny"
unmaintained = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "LicenseRef-Chromaticity-Proprietary",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
