#
# Chromaticity desktop application shell (Tauri 2 per ADR-018).

[package]
name = "chromaticity-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity desktop application shell."

[lib]
# Tauri 2 splits the app into a library (shared across desktop +
# potential mobile targets) with a thin binary entry in src/main.rs.
name = "chromaticity_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chromaticity-app"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2 powers the EV-LIBRARY-THUMBNAIL pipeline's deterministic key
# hashing + the deterministic-stub renderer per docs/26 row 67. Same
# 0.10 line already used by engine/scene.
sha2 = "0.10"
chromaticity-audio = { version = "0.0.0", path = "../../engine/audio" }
chromaticity-camera-adapter = { version = "0.0.0", path = "../../integrations/camera-adapter" }
chromaticity-runtime = { version = "0.0.0", path = "../../engine/runtime" }
chromaticity-scene = { version = "0.0.0", path = "../../engine/scene" }
chromaticity-ui-bridge = { version = "0.0.0", path = "../ui-bridge" }
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# Wave 1c-β Phase 4 Lane B: the Syphon command handlers
# (`commands::syphon`) call into the syphon-adapter directly to drive
# `SyphonServerDirectory::current_servers()`. The adapter crate body
# is gated by `#![cfg(target_os = "macos")]` per ADR-021 §1, so the
# dep is target-scoped to keep non-macOS builds free of the
# Objective-C binding stack; the command handlers themselves carry a
# matching `#[cfg(target_os = "macos")]` per-fn gate with a non-macOS
# arm that returns the platform-unavailable error.
[target.'cfg(target_os = "macos")'.dependencies]
chromaticity-syphon-adapter = { version = "0.0.0", path = "../../integrations/syphon-adapter" }

[dev-dependencies]
ts-rs = "10"
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
