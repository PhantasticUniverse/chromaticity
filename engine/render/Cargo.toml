#
# Chromaticity engine render crate.
#
# Phase-2 slice 1 scaffold. Establishes the wgpu + naga + GLSL 4.50 →
# SPIR-V toolchain mandated by docs/adr/ADR-011-rendering-backend.md
# and produces the first evidence row toward `EV-RENDER-CONFORMANCE`
# (docs/26-evidence-artifact-registry.md row 28). Slice 1 ships:
#
#   - a single-pass `compile_and_render_single_pass` entry point
#     consuming hand-written GLSL fragment source (no Lygia trial in
#     this slice; the AO trial-vendoring is a follow-up wave),
#   - a hardcoded full-screen-triangle vertex shader,
#   - RGBA8Unorm offscreen target + pixel readback (RGBA32F / RGBA16F
#     coverage per ADR-011 §Decision is later-slice scope),
#   - structured `RenderError` reporting for naga compile / wgpu
#     adapter / device-loss failures.
#
# Slice 1 deliberately omits multi-pass scheduling, render-graph data
# structures, `engine/scene::PassSpec` consumption, feedback texture
# sampling, transition orchestration, audio uniform binding, and the
# Metal / DX12 backend matrix — each is its own follow-up slice.
#
# Slice 4 (the current head) adds: feedback-texture sampling
# (PassDef::feedback_self + ping-pong texture pair, multi-frame
# execution via MultipassSpec::frame_count), RGBA32F / RGBA16F
# float-target conformance per ADR-011 §Decision (TargetFormat
# enum + per-pass target_format), and the
# chromaticity_scene::Scene → MultipassSpec adapter (gated behind
# the optional `scene-adapter` cargo feature). The slice-2
# byte-hash corpus stays bit-identical for the trivial
# (single-frame, Rgba8Unorm-only, no feedback) path.
#
# Governing ADRs:
#   ADR-011 — rendering backend (docs/adr/ADR-011-rendering-backend.md)
#   ADR-018 — non-scene UI toolkit (docs/adr/ADR-018-non-scene-ui-toolkit.md)
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-render"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity render pipeline (wgpu + naga GLSL→SPIR-V multipass + feedback + float targets + scene adapter)."

[lints]
workspace = true

[dependencies]
# wgpu 26 is the highest line whose published MSRV (1.84) is compatible
# with the workspace MSRV (1.85.0). wgpu 27+ raises MSRV to 1.88; bumps
# require a paired rust-toolchain.toml + Cargo.toml MSRV bump under a
# `policy`-scoped PR. License: Apache-2.0 OR MIT (allow-listed by
# /deny.toml).
# Default features bring std + the platform-native backends (dx12,
# metal, gles, vulkan, wgsl, webgpu, parking_lot). slice-1 disables
# default features and explicitly enumerates the backends we ship:
# Metal (macOS), Vulkan (Linux + Windows for now), and GLES (legacy
# fallback). DX12 is deliberately deferred to a follow-up slice — wgpu
# 26.0.6's wgpu-hal DX12 bindings hit a multi-version `windows-core`
# resolution conflict against Tauri 2's transitive `windows` crates
# (0.54 + 0.58 + 0.61 + 0.62 coexist in Cargo.lock), which surfaces
# as wgpu-hal compile errors on `windows-latest` clippy. Vulkan on
# Windows is a working backend (mesa-vulkan via WSL or DXVK on bare
# metal); revisit DX12 when upstream wgpu / Tauri align their
# windows-rs version pins. slice-1 also adds the `glsl` GLSL frontend,
# `spirv` SPIR-V passthrough, and `naga-ir` direct-IR shader source so
# the naga compile step is observable from this crate. License:
# Apache-2.0 OR MIT (allow-listed by /deny.toml).
wgpu = { version = "26", default-features = false, features = [
    "metal",
    "vulkan",
    "gles",
    "glsl",
    "spirv",
    "naga-ir",
    "wgsl",
] }

# naga 26 matches wgpu 26's pinned reexport; the GLSL frontend produces
# the IR that wgpu's SPIR-V passthrough consumes. License: Apache-2.0
# OR MIT (allow-listed by /deny.toml).
naga = { version = "26", default-features = false, features = ["glsl-in", "spv-out", "wgsl-out"] }

# bytemuck zero-copy POD/Cast helpers for vertex / uniform buffer
# layouts. License: Apache-2.0 OR MIT OR Zlib (allow-listed by
# /deny.toml).
bytemuck = { version = "1", features = ["derive"] }

# pollster blocks on wgpu's async device / buffer-map futures from a
# synchronous context. The slice-1 entry point is sync; later slices
# that integrate with the runtime bus may switch to a real executor.
# License: Apache-2.0 OR MIT (allow-listed by /deny.toml).
pollster = "0.4"

# thiserror generates the `RenderError` Display / Error impls. Already
# pulled transitively by Tauri 2 / wgpu; adding the direct dep keeps
# our error surface boundary explicit. License: Apache-2.0 OR MIT
# (allow-listed by /deny.toml).
thiserror = "2"

# chromaticity-scene is an OPTIONAL dependency, gated behind the
# `scene-adapter` cargo feature. The render scheduler stays scene-
# agnostic by default (see `multipass.rs` module-level doc); the
# `scene_adapter` module bridges `engine/scene::PassSpec` →
# `MultipassSpec` for callers that want the coupling. CI's workspace
# test invocation enables `--all-features` on this crate so the
# adapter is exercised; downstream binaries opt in explicitly.
chromaticity-scene = { version = "0.0.0", path = "../scene", optional = true }

# chromaticity-audio is an OPTIONAL dependency, gated behind the
# `audio-binding` cargo feature. The render scheduler stays audio-
# agnostic by default — engine/audio publishes a plain-data
# `AudioUniformSnapshot` (per its module-level prose) and the
# slice-5a `audio_adapter` module on the engine/render side maps
# that snapshot into a `Vec<UniformInput>` bound under the
# `syn_BPM` compat-syn-v1 retention (docs/36 line 117) plus four
# chromaticity-native `chroma_*` audio primitives introduced by
# slice-5a (`chroma_AudioRMS`, `chroma_AudioPeak`,
# `chroma_AudioFFTLow`, `chroma_AudioFFTHigh`). Crate coupling
# stays consumer-side: engine/audio does NOT depend on
# engine/render. CI's workspace test invocation enables
# `--all-features` on this crate so the adapter is exercised;
# downstream binaries opt in explicitly.
chromaticity-audio = { version = "0.0.0", path = "../audio", optional = true }

workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

[features]
default = []
# Enables the `scene_adapter` module which produces a `MultipassSpec`
# from a `chromaticity_scene::Scene`. Turning this on adds a
# crate-level dep on `chromaticity-scene`. See `scene_adapter.rs`
# module-level doc for the schema → runtime mapping rules.
scene-adapter = ["dep:chromaticity-scene"]
# Enables the `audio_adapter` module which marshals an
# `AudioUniformSnapshot` (slice-1 producer-side, plain data) into a
# `Vec<UniformInput>` keyed by the `docs/36` v1.3.0 reactive-symbol
# vocabulary. Turning this on adds a crate-level dep on
# `chromaticity-audio`. See `audio_adapter.rs` module-level doc for
# the symbol → UniformValue mapping table.
audio-binding = ["dep:chromaticity-audio"]

[dev-dependencies]
# `serde_json` is needed by the slice-4 scene-adapter T1 / T2 tests
# to construct `Scene` extension maps via the `json!()` macro. The
# `chromaticity_scene::Scene` re-exports `serde_json::Map` /
# `serde_json::Value` in its public API; the tests mirror that
# vocabulary. License: Apache-2.0 OR MIT (allow-listed by /deny.toml).
serde_json = "1"

# criterion 0.5 backs the Phase-4d-exit `EV-SHADER-CACHE` cold-vs-warm
# shader-compile bench harness under `benches/shader_cache.rs`.
# Mirrors the engine/runtime `EV-PERF-BUDGETS` bench's Path B nightly-
# only posture: `cargo bench --workspace --benches` in the existing
# `.github/workflows/macos-nightly.yml` workflow runs this file once
# per nightly cycle alongside the `budgets` harness; no per-PR matrix
# expansion. `default-features = false` drops the `rayon` + `plotters`
# defaults the AO doesn't consume locally; `cargo_bench_support` keeps
# the harness usable from `cargo bench`. License: Apache-2.0 OR MIT
# (allow-listed by /deny.toml). MSRV 1.74 (workspace MSRV is 1.85.0,
# so no friction). Already present in `Cargo.lock` via the engine/
# runtime `budgets` bench dev-dep.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
# Path B nightly-only criterion harness for `EV-SHADER-CACHE` (row 79
# of `docs/26-evidence-artifact-registry.md`); see
# `benches/shader_cache.rs` module-prose for the cold-vs-warm framing
# and the `docs/10-performance-latency-budgets.md` §Shader Cache
# budget anchors. Observation-only at this PR; budget assertion via
# `scripts/budget-check.sh` is a separate `chore(release-eng)`
# follow-up.
name = "shader_cache"
harness = false
