# SPDX-License-Identifier: LicenseRef-Chromaticity-Proprietary
# SPDX-FileCopyrightText: 2026 Chromaticity
#
# Chromaticity engine runtime crate.
#
# Phase-1 scaffold. Holds the canonical state core, the command bus,
# and (as a module, per the Phase-1 scaffold brief) the render-graph
# implementation until incremental-compile or license-boundary concerns
# justify extracting the graph to its own crate. No public surface
# until the first-slice implementation PR.
#
# Governing ADRs:
#   ADR-001 — runtime model (docs/adr/ADR-001-runtime-model.md)
#   ADR-004 — canonical state model (docs/adr/ADR-004-state-model.md)
#   ADR-006 — thread and process model (docs/adr/ADR-006-thread-and-process-model.md)
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity engine runtime (state core, command bus, render graph)."

[lints]
workspace = true

[features]
# Slice-5.3 — engine/script command-bus adapter. Off by default;
# opt-in only. Enabling pulls the optional `chromaticity-script`
# dep + activates the [`script_bridge`] module that bridges
# `ScriptCommand` values from the engine/script producer-side
# [`chromaticity_script::ScriptCommandSender`] trait onto a
# host-side `crossbeam-channel` consumer the runtime can drain.
# The dep direction is engine/runtime → engine/script (consumer
# imports producer types); engine/script does NOT take a
# `chromaticity-runtime` dep — slice-5.1's
# `ScriptCommandSender` trait remains the cross-crate seam.
script-bridge = ["dep:chromaticity-script"]

[dependencies]
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# chromaticity-observability owns the canonical `CommandKind`,
# `EventKind`, and `RuntimeLifecycleState` label-enums mirroring
# docs/31 §Scheme and Metric Catalog. The runtime bus imports these
# enums so the in-bus emission counters key off the same vocabulary
# slice-3 PR 5 (PR `#328`) wired through
# `MetricEvent::RuntimeCommandsDispatched`, `RuntimeEventsEmitted`,
# `RuntimeLifecycleTransition`, and `RuntimeUptime` via the
# `scheduler::observability::TickEmitter` trait + `MetricEmitterAdapter`
# wrapping `Box<dyn EmitMetric>` consumed by
# `Scheduler::with_metric_emitter`. Slice-2 did NOT depend on any
# other observability surface (no `MetricSink`, no emitter types);
# those couplings landed in slice-3 PR 5 per the scheduler module
# at `engine/runtime/src/scheduler/observability.rs`.
chromaticity-observability = { version = "0.0.0", path = "../observability" }

# chromaticity-audio carries the canonical
# `AudioUniformSnapshot` producer surface (slice-1 entry point plus
# slice-3a/b extractors) the slice-3 PR 3 scheduler-tick audio-pull
# seam wraps. The runtime imports the snapshot type only — the
# analyser is owned on a separate audio analysis thread per ADR-006,
# and the slice-3 PR 3 `AudioPull` trait abstracts over how the
# scheduler obtains the latest snapshot at the start of each tick.
# License: inherited first-party (LicenseRef-Chromaticity-Proprietary).
chromaticity-audio = { version = "0.0.0", path = "../audio" }

# OSC settings defaults import the adapter-owned ADR-013 port constants
# so the persisted runtime settings document and network adapter stay
# in lockstep.
chromaticity-osc-adapter = { version = "0.0.0", path = "../../integrations/osc-adapter" }

# Slice-5.3 — chromaticity-script optional dep behind the
# `script-bridge` feature. The runtime adapter implements the
# slice-5.1 `chromaticity_script::ScriptCommandSender` trait so a
# `ScriptRuntime` configured via `with_command_sender` routes
# script-emitted reactive writes onto a runtime-owned consumer
# channel. Off by default to keep the runtime crate dep-free for
# call sites that don't link the script lane. The dep direction
# is engine/runtime → engine/script (consumer imports producer
# types) so engine/script stays independent of runtime types,
# preserving slice-5.1's cross-crate seam.
chromaticity-script = { version = "0.0.0", path = "../script", optional = true }

# crossbeam-channel 0.5 backs the Phase-1 in-memory CommandChannel
# implementation. Wrapped behind the crate-local `CommandChannel`
# trait so Phase-3+/4a persistence work can substitute a disk-backed
# or reconciliation-layer implementation without touching producer
# call sites. License: MIT OR Apache-2.0 (allow-listed by deny.toml).
# Slice-5.3 also reuses crossbeam-channel for the script-bridge
# bounded MPMC consumer queue.
crossbeam-channel = "0.5"

# Wave 2.1 Lane C.3 `EV-INTEGRATION-MATRIX` settings persistence: the
# `settings` module serialises operator preferences to TOML in the
# per-user data dir so the Settings view's form state survives
# restart. serde + toml carry the load-bearing (de)serialisation;
# both crates are MIT/Apache-2.0 (allow-listed by deny.toml).
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# criterion 0.5 backs the Phase-3 wave PR 6 EV-PERF-BUDGETS proxy
# benches under `benches/budgets.rs`. Path B nightly-only posture: the
# harness runs once per day on Apple Silicon Metal via the existing
# `.github/workflows/macos-nightly.yml` workflow rather than per-PR.
# `default-features = false` drops the `rayon` + `plotters` defaults
# the AO doesn't consume locally; `cargo_bench_support` keeps the
# harness usable from `cargo bench`. License: Apache-2.0 OR MIT
# (allow-listed by deny.toml). MSRV 1.74 (workspace MSRV is 1.85.0,
# so no friction).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
# Path B nightly-only criterion harness; see `benches/budgets.rs`
# module-prose for the observable-subsystem proxy framing and the
# scheduler-tick frame-loop deferral that motivates measuring through
# the public command-bus / state-replay / preset / playlist surface.
name = "budgets"
harness = false
