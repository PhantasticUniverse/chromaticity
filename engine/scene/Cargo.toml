# SPDX-FileCopyrightText: 2026 Chromaticity
#
# Chromaticity engine scene crate.
#
# Phase-1 scaffold. Holds the scene schema types, the canonical-model
# normalizer, and the validator that consumes
# docs/36-reactive-symbol-catalog.md as its authoritative symbol source.
# No public surface until the first-slice implementation PR.
#
# Governing ADRs:
#   ADR-007 — scene warm-switch policy
#             (docs/adr/ADR-007-scene-warm-switch-policy.md)
#   ADR-008 — transition and traveler semantics
#             (docs/adr/ADR-008-transition-and-traveler-semantics.md)
#
# Symbol source of truth: docs/36-reactive-symbol-catalog.md.
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-scene"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity scene schema, canonical normalizer, and validator."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# chromaticity-observability owns the canonical `SceneValidationOutcome`
# and `SceneLintCategory` label-enums mirroring docs/31 §Scheme and
# Metric Catalog. The scene crate imports these enums so the in-process
# validation / lint counters (see `crate::observability`) key off the
# same vocabulary the slice-3 runtime-bus wiring will route through
# `MetricEvent::SceneValidations` and `MetricEvent::SceneLintWarnings`.
# Slice-2 does NOT depend on any other observability surface (no
# `MetricSink`, no emitter types); adding those couplings is a slice-3
# concern. Mirrors the integrations/osc-adapter/Cargo.toml dependency
# pattern that added the same dep for `OscPacketOutcome` emission.
chromaticity-observability = { version = "0.0.0", path = "../observability" }
