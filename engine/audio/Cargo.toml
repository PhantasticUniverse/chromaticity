#
# Chromaticity engine audio crate.
#
# Phase-1 scaffold. Holds the audio-frame dataflow types and the
# ingest boundary types that the Phase-2 audio-uniform generation
# pipeline will consume. No public surface until the first-slice
# implementation PR.
#
# Governing documents:
#   docs/06-audio-engine.md              — audio engine contract.
#   docs/adr/ADR-011-rendering-backend.md — audio section (ingest
#                                            boundary and pipeline
#                                            integration points).
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-audio"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity audio-frame dataflow and ingest boundary types."

[lints]
workspace = true

[dependencies]
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# chromaticity-observability owns the canonical `AudioIngestFrameStatus`
# and `AudioIngestState` label-enums mirroring docs/31 §Scheme and
# Metric Catalog. Slice-2 imports those label enums only (no
# `MetricSink` / emitter coupling) so the in-crate emission-site
# counters key off the same vocabulary the slice-3 runtime-bus
# wiring will route through `MetricEvent::AudioIngestFrames` /
# `MetricEvent::AudioIngestSamples` /
# `MetricEvent::AudioIngestStateTransition`. Mirrors the slice-2
# pattern seeded by `integrations/osc-adapter/Cargo.toml`.
chromaticity-observability = { version = "0.0.0", path = "../observability" }

# cpal 0.15 is the Phase-2 device-capture path, authorised as a
# dep-slot under the slice-2 brief. No cpal types are imported or
# invoked in slice-2 Rust code; the slot exists so slice-3 can land
# the first real device-callback integration without a separate
# dep-authorisation cycle. Default features (license: Apache-2.0 per
# crate metadata; transitive platform shims — coreaudio-rs/sys on
# macOS, alsa-sys on Linux, wasapi on Windows — are license-audited
# via cargo deny check licenses in the preflight).
#
# The catch_unwind FFI-seam discipline that every slice-3 cpal
# callback MUST honour is pinned as a standing-constraint doc
# comment at engine/audio/src/ingest.rs top-of-module (the natural
# integration site for the real callback when it lands).
cpal = "0.15"
