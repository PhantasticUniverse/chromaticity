#
# Chromaticity engine audio crate.
#
# Phase-1 scaffold. Holds the audio-frame dataflow types and the
# ingest boundary types that the Phase-2 audio-uniform generation
# pipeline will consume. No public surface until the first-slice
# implementation PR.
#
# Governing documents:
#   docs/06-audio-engine.md              — audio engine contract.
#   docs/adr/ADR-011-rendering-backend.md — audio section (ingest
#                                            boundary and pipeline
#                                            integration points).
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-audio"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity audio-frame dataflow and ingest boundary types."

[lints]
workspace = true

[dependencies]
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# chromaticity-observability owns the canonical `AudioIngestFrameStatus`
# and `AudioIngestState` label-enums mirroring docs/31 §Scheme and
# Metric Catalog. Slice-2 imports those label enums only (no
# `MetricSink` / emitter coupling) so the in-crate emission-site
# counters key off the same vocabulary the slice-3 runtime-bus
# wiring will route through `MetricEvent::AudioIngestFrames` /
# `MetricEvent::AudioIngestSamples` /
# `MetricEvent::AudioIngestStateTransition`. Mirrors the slice-2
# pattern seeded by `integrations/osc-adapter/Cargo.toml`.
chromaticity-observability = { version = "0.0.0", path = "../observability" }

# cpal 0.15 is the Phase-2 device-capture path. Slice-2 authorised
# the dep-slot; slice-3b (engine/audio/src/cpal_source.rs) activates
# it by landing the first real `cpal::Stream` callback under the
# FFI-seam `catch_unwind` discipline pinned at the top of
# `engine/audio/src/ingest.rs`. Default features (license: Apache-2.0
# per crate metadata; transitive platform shims — coreaudio-rs/sys on
# macOS, alsa-sys on Linux, wasapi on Windows — are license-audited
# via cargo deny check licenses in the preflight).
cpal = "0.15"

# crossbeam-channel 0.5 backs the bounded SPSC channel between the
# cpal data callback (audio thread) and the analyser-side
# `CpalSource::try_pull`. Bounded capacity + drop-on-full is the
# §7.11 degraded-mode contract: under-runs surface as `WouldBlock` to
# the analyser, never as a stalled audio thread. Already in the
# workspace via engine/runtime (license: MIT OR Apache-2.0; both
# allow-listed by /deny.toml).
crossbeam-channel = "0.5"

# rustfft 6 powers the slice-1 8-band log-spaced FFT magnitude
# decomposition behind `uniforms::extract_uniform_snapshot`. Default
# features enable host-architecture SIMD intrinsics (avx on x86_64,
# neon on aarch64, sse fallback) — slice-1 stays on default features
# because the 1024-1024 sample-size FFT runs we feed it benefit from
# the SIMD path on the per-frame analyser cadence the §7.1 pipeline
# targets. License: MIT OR Apache-2.0 (both allow-listed by
# /deny.toml). Transitive crates (num-complex, num-traits,
# num-integer, primal-check, strength_reduce, transpose) all carry
# MIT OR Apache-2.0; no allowlist additions required.
rustfft = "6"
