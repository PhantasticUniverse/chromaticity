#
# Chromaticity engine observability crate.
#
# Phase-1 slice-2 scaffold. Holds the Rust type surface mirroring the
# Phase-1 metric catalog in docs/31-supportability-privacy-ops-policy.md
# §Scheme and Metric Catalog (landed in PR number 19), plus the
# EmitMetric trait and an in-process InMemoryEmitter stub.
#
# Divergence between this crate's Rust types and docs/31 §Scheme and
# Metric Catalog is a schema-drift failure. If the catalog itself
# needs amendment, raise a docs(policy) PR against docs/31 first
# (NON-DELEGABLE surface, AO-authored) and then update the Rust
# types to match the amended baseline.
#
# Governing documents:
#   docs/31-supportability-privacy-ops-policy.md — metric catalog
#                                                   baseline (authoritative).
#   docs/adr/ADR-016-observability-and-telemetry-posture.md
#                                                 — posture constraints.
#
# ADR-016 posture constraints this crate's stub emitter honours:
#   - No network I/O by default (none at Phase 1).
#   - No payload logging (no scene source, no script source, no audio
#     buffers, no operator-entered text).
#   - Local in-process emission only; the Prometheus text-format
#     endpoint is a Phase 4d item and lands outside this crate.
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-observability"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity observability trait surface and Phase-1 metric types."

[lints]
workspace = true

[dependencies]
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# `serde_json` 1 backs the `crash_redaction` module's
# `serde_json::Value`-based redactor. Crash-report payload shapes are
# unknown at module-author time (the actual crash-payload-construction
# code lands in a future PR), so the redactor operates on a generic
# JSON tree and replaces matched key/value pairs with the
# `[REDACTED]` placeholder by field-name pattern. This is a pure-data
# crate (no network I/O); it is allowlisted alongside `workspace-hack`
# in the `tests/no_network_egress` corpus.
#
# See `engine/observability/src/crash_redaction.rs` module-level prose
# for the ADR-016 §Crash reporting traceability + the deferred-
# composition framing (primitives ship now; future crash-payload
# construction code composes them).
serde_json = "1"
