#
# Chromaticity authoring crate.
#
# Phase-4b foundational crate for the authoring environment. Hosts the
# diagnostic-renderer surface that bridges engine-side errors (compile,
# script, JSON, coercion) into a UI-friendly structured `Diagnostic`
# shape per docs/37-authoring-environment-spec.md §3.4 + §3.5. The
# Tauri/UI consumer-side wiring lands in a follow-up wave; this crate
# stays producer-side and depends only on the engine error sources.
#
# This is PR 1 of the EV-AUTHORING-DIAGNOSTICS wave (the diagnostic-
# renderer surface + minimal in-source pins). PR 2 ships the multi-class
# fixture corpus exercising compile / script / JSON / coercion error
# paths against real engine outputs.
#
# All workspace lints (including unsafe_code = forbid,
# clippy::unwrap_used = deny, clippy::expect_used = deny) are inherited
# via [lints] workspace = true; no local relaxation. See
# docs/43-development-standards.md §12.1.

[package]
name = "chromaticity-authoring"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity authoring environment surface (diagnostic renderer for compile / script / JSON / coercion errors)."

[lints]
workspace = true

[dependencies]
# serde + serde_json: the Diagnostic surface is intended to cross the
# Tauri IPC seam (a later wave wires it through app/ui-bridge), so the
# canonical types derive Serialize / Deserialize today even though the
# UI consumer is not yet wired. serde_json::Error is also the input type
# for the JSON-class diagnostic mapper, where line / column extraction
# uses serde_json::Error::line / column.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# thiserror is not strictly needed here — the crate currently emits
# Diagnostic values rather than producing its own error type — but is
# kept off the dep list to minimize surface. Add it when the crate
# grows a fallible path of its own.

# Engine error sources translated by the diagnostic mapper:
# - chromaticity-render::RenderError (FragmentParse, FragmentValidate,
#   IncludeError) → Compile diagnostics.
# - chromaticity-script::ScriptError (Compile / Runtime / TimeoutExceeded /
#   MemoryCapExceeded / ValueConversion / ...) → Script diagnostics.
# - chromaticity-scene::loader::LoadError (Json) and
#   chromaticity-scene::lint::Warning (CoercionApplied, LegacyKey,
#   UnknownControlType, DeprecatedScriptApi) +
#   chromaticity-scene::validator::ValidationError → Json + Coercion
#   diagnostics.
chromaticity-render = { version = "0.0.0", path = "../render" }
chromaticity-scene = { version = "0.0.0", path = "../scene" }
chromaticity-script = { version = "0.0.0", path = "../script" }

# notify: cross-platform filesystem watcher backing the live-reload
# pipeline. FSEvents on macOS, ReadDirectoryChangesW on Windows,
# inotify on Linux. License is CC0-1.0 (in deny.toml allow list);
# transitives are MIT / Apache-2.0 / Unlicense-OR-MIT, all already
# in the workspace dep graph or covered by the existing allow list.
# Used in production by cargo-watch, mdbook serve, and most Rust
# hot-reload tools. See engine/authoring/src/live_reload.rs module
# docstring "Why notify" section for the wave-1 sourcing rationale.
notify = "8"

# dirs: cross-platform home / local-data directory resolution backing
# the reference-app user-data root auto-discovery surface (per
# ADR-015 lines 10-11). On macOS the canonical path is under
# `~/Library/Application Support/...`; on Windows the canonical path
# is under `%LOCALAPPDATA%\...`. License: MIT OR Apache-2.0
# (allow-listed by /deny.toml). Already present in Cargo.lock via
# transitive deps.
dirs = "6"

# naga 26 (runtime) matches the engine/render pin (which is itself
# paired with wgpu 26's reexport — see engine/render/Cargo.toml).
# The Shadertoy-import converter
# (`engine/authoring/src/import_shadertoy.rs`) gates package
# emission behind the same naga GLSL frontend + IR validator pair
# that engine/render::single_pass uses internally — a Shadertoy
# fragment that would not parse + validate at render time rejects
# at import time with a clean
# `ImportError::GlslCompileError` instead of leaving a broken
# `.chroma` package on disk. `compile_glsl_module` is `pub(crate)`
# in engine/render (a slice-boundary signal per CLAUDE.md), so the
# converter reproduces the parse + validate seam directly against
# `naga::front::glsl::Frontend`. License: Apache-2.0 OR MIT
# (allow-listed by /deny.toml). Already present in Cargo.lock via
# engine/render. The dev-dependency below is kept for the
# scaffolder T1 / T2 corpora that pre-date this runtime use; cargo
# de-duplicates the two listings into a single graph node.
naga = { version = "26", default-features = false, features = ["glsl-in"] }

workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

[dev-dependencies]
# naga 26 matches the engine/render pin (which is itself paired with
# wgpu 26's reexport — see engine/render/Cargo.toml). The scaffolder
# T1 + T2 corpora invoke the same naga GLSL frontend + IR validator
# pair that engine/render::single_pass uses internally
# (`compile_glsl_module` is `pub(crate)` there, so the scaffolder
# reproduces the parse + validate seam in dev-only test code rather
# than widening the engine/render visibility — `pub(crate)` is a
# slice-boundary signal per CLAUDE.md). The naga path is
# adapter-free, so the GLSL-compiles assertion is portable across
# every CI runner regardless of wgpu adapter availability. License:
# Apache-2.0 OR MIT (allow-listed by /deny.toml). Already present in
# Cargo.lock via engine/render.
naga = { version = "26", default-features = false, features = ["glsl-in"] }
