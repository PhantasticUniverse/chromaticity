# SPDX-License-Identifier: LicenseRef-Chromaticity-Proprietary
# SPDX-FileCopyrightText: 2026 Chromaticity
#
# REUSE 3.2 configuration.
# Governs per-glob default license + copyright so files that cannot carry
# inline SPDX headers (binaries, assets, generated artifacts) are still
# covered by `reuse lint`. See docs/43-development-standards.md Sec.10.2.

version = 1

# -----------------------------------------------------------------------------
# Default: every file not matched by a more specific annotation below is
# proprietary Chromaticity source. Individual source files still carry
# inline SPDX headers; these defaults are the safety net.
# -----------------------------------------------------------------------------
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# Documentation: CC-BY-4.0 per LICENSE. Individual docs pages may override via
# front-matter + inline SPDX header (e.g. third-party vendored docs).
# -----------------------------------------------------------------------------
[[annotations]]
path = "docs/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "CC-BY-4.0"

# -----------------------------------------------------------------------------
# ADRs are normative decision records; keep them CC-BY-4.0 alongside docs.
# -----------------------------------------------------------------------------
[[annotations]]
path = "docs/adr/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "CC-BY-4.0"

# -----------------------------------------------------------------------------
# Built mkdocs corpus (Wave 1d-α): the rendered HTML lands at dist/help/ and
# is committed for tauri-build's generate_context!() resource resolver.
# Source pages under docs-corpus/docs/ already carry inline SPDX headers; the
# rendered output is a derivative work and should carry the same CC-BY-4.0
# license as the docs/ corpus. Without this block, dist/help/** would fall
# through to the proprietary safety-net annotation, miscategorising the
# rendered docs.
# -----------------------------------------------------------------------------
[[annotations]]
path = "dist/help/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "CC-BY-4.0"

# -----------------------------------------------------------------------------
# Root repo-policy and governance files are proprietary (authoritative).
# -----------------------------------------------------------------------------
[[annotations]]
path = [
  "LICENSE",
  "README.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "CODEOWNERS",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".github/**",
  "REUSE.toml",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# release-eng/ ships signing + notarization + appcast-staging shell stubs
# for the Wave 1e release pipeline. First-party Chromaticity infrastructure;
# proprietary. Explicit block so the policy posture is readable at a glance.
# -----------------------------------------------------------------------------
[[annotations]]
path = "release-eng/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# License texts in LICENSES/ are third-party canonical license text
# (or our own proprietary text). `reuse lint` expects no annotation on these;
# we add an explicit entry matching the license identifier to silence the tool
# on non-SPDX-ID filenames and keep coverage explicit.
# -----------------------------------------------------------------------------
[[annotations]]
path = "LICENSES/CC-BY-4.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "Creative Commons"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "LICENSES/LicenseRef-Chromaticity-Proprietary.txt"
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# Generated artifacts (SBOMs, changelog sections, docs reference generation).
# Still require coverage; inherit from default root posture.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
  "generated/**",
  "**/*.sbom.json",
  "**/*.sbom.xml",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# JSON configuration artifacts. JSON cannot carry inline SPDX headers so
# REUSE coverage is specified here rather than relying on the root `**`
# aggregate fall-through. Matches the root proprietary posture.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "tsconfig.node.json",
  "app/shell/tauri.conf.json",
  "app/shell/capabilities/**/*.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# Placeholder / sentinel files that cannot carry a header but must still
# satisfy reuse lint. Kept proprietary per the root default.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
  "dist/.gitkeep",
  "app/shell/icons/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# `ts-rs` auto-generated TypeScript bindings.
#
# The per-type files under `app/ui-bridge/bindings/` (canonical export) and
# `src/lib/ipc/bindings/` (frontend-side mirror) are emitted by
# `ts_rs::export_to(...)` from `app/shell/tests/export_bindings.rs` and carry
# only the `ts-rs` "do not edit manually" header — never an SPDX header.
# Coverage falls through to the root `**` aggregate today; this block makes
# the proprietary posture explicit so that a future REUSE 3.x precedence
# semantics shift cannot silently uncover them. Hand-authored barrels (e.g.
# `src/lib/ipc/bindings/index.ts`) carry inline SPDX headers and the
# `precedence = "override"` here is harmless under aggregate semantics.
# -----------------------------------------------------------------------------
[[annotations]]
path = [
  "app/ui-bridge/bindings/**",
  "src/lib/ipc/bindings/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chromaticity"
SPDX-License-Identifier = "LicenseRef-Chromaticity-Proprietary"

# -----------------------------------------------------------------------------
# Third-party code lives under third_party/<origin>/ and overrides here with an
# explicit license per the upstream LICENSE file at the pinned version. See
# docs/43-development-standards.md Sec.10.3 and docs/29-cleanroom-legal-policy-baseline.md
# Sec.Bundled GLSL Library Handling.
# -----------------------------------------------------------------------------

# Lygia v1.1.4 trial vendor snapshot. Prosperity-3.0.0 is not in the SPDX
# license list (2026-04-29 snapshot), so the canonical SPDX identifier uses
# the `LicenseRef-` prefix. The verbatim license text lives at
# `LICENSES/LicenseRef-Prosperity-3.0.0.txt` and the per-version provenance
# marker at `third_party/lygia/UPSTREAM-VERSION.md`. The `deny.toml`
# `licenses.allow` entry uses the same identifier; final commercial-use
# license election is deferred to Phase-5 `EV-LICENSE-AUDIT`.
[[annotations]]
path = "third_party/lygia/**"
precedence = "override"
SPDX-FileCopyrightText = "Patricio Gonzalez Vivo and Lygia contributors"
SPDX-License-Identifier = "LicenseRef-Prosperity-3.0.0"

# License text file: surface the SPDX identifier on the canonical text so
# `reuse lint` does not flag it as missing coverage.
[[annotations]]
path = "LICENSES/LicenseRef-Prosperity-3.0.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "Patricio Gonzalez Vivo and Lygia contributors"
SPDX-License-Identifier = "LicenseRef-Prosperity-3.0.0"

# Syphon-Framework canonical source vendor (Wave 1c-β Phase 1.7, 2026-05-07).
# BSD-3-Clause is already on `deny.toml` `[licenses].allow`; the
# `BSD-3-Clause.txt` filename is a chromaticity-side
# LICENSES/ mirror of the upstream `License.txt` for clean-room provenance,
# not a non-SPDX dialect. The vendor is an unmodified verbatim snapshot per
# `third_party/Syphon-Framework/CHROMATICITY_VENDOR_NOTE.md`.
[[annotations]]
path = "third_party/Syphon-Framework/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "2010-2023 bangnoise (Tom Butterworth) & vade (Anton Marini)",
  "2020-2023 Maxime Touroute & Philippe Chaurand (Millumin)",
]
SPDX-License-Identifier = "BSD-3-Clause"

# License text file: surface the SPDX identifier on the canonical text so
# `reuse lint` does not flag it as missing coverage.
[[annotations]]
path = "LICENSES/BSD-3-Clause.txt"
precedence = "override"
SPDX-FileCopyrightText = "2010 bangnoise (Tom Butterworth) & vade (Anton Marini)"
SPDX-License-Identifier = "BSD-3-Clause"

# hg_sdf canonical source vendor (parity-closure Lane C, 2026-05-22).
# Upstream is dual-licensed MIT OR CC-BY-NC-4.0; we elect the MIT track
# unambiguously (the CC-BY-NC track fails the commercial-distribution guard
# per `docs/29-cleanroom-legal-policy-baseline.md`). MIT is already on
# `deny.toml` `licenses.allow`, so no `deny.toml` change is needed.
# Election rationale + provenance marker at
# `third_party/hg_sdf/UPSTREAM-VERSION.md`; election decision documented
# in `docs/56-shader-sourcing-research.md` Sec.2.14.
[[annotations]]
path = "third_party/hg_sdf/**"
precedence = "override"
SPDX-FileCopyrightText = "2011-2021 Mercury Demogroup"
SPDX-License-Identifier = "MIT"

# License text file: surface the SPDX identifier on the canonical text so
# `reuse lint` does not flag it as missing coverage.
[[annotations]]
path = "LICENSES/MIT.txt"
precedence = "override"
SPDX-FileCopyrightText = "2011-2021 Mercury Demogroup"
SPDX-License-Identifier = "MIT"

# cpal 0.17.1 patched vendor snapshot (system-audio loopback fix, ADR-022).
# Wired via the root Cargo.toml `[patch.crates-io]` path override; the only
# deviation from the verbatim crates.io crate is a single macOS process-tap
# initializer change in `src/host/coreaudio/macos/loopback.rs` (the global
# `initStereoGlobalTapButExcludeProcesses:` path vs the upstream all-zero
# device-scoped initializer — RustAudio/cpal#329). Apache-2.0 is already on
# `deny.toml` `[licenses].allow`, so no `deny.toml` change is needed. Patch +
# provenance at `third_party/cpal/UPSTREAM-VERSION.md`.
[[annotations]]
path = "third_party/cpal/**"
precedence = "override"
SPDX-FileCopyrightText = "The cpal contributors"
SPDX-License-Identifier = "Apache-2.0"

# License text file: surface the SPDX identifier on the canonical text so
# `reuse lint` does not flag it as missing coverage.
[[annotations]]
path = "LICENSES/Apache-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "The cpal contributors"
SPDX-License-Identifier = "Apache-2.0"
