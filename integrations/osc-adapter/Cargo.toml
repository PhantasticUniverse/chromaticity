#
# Chromaticity OSC adapter crate.
#
# Phase-1 scaffold; first integration adapter under `integrations/`.
# The OSC adapter gates `EV-NET-HARDENING` (networking conformance)
# and has the most-specified ADR coverage of any Phase-1 adapter
# candidate, making it the chosen seed for the adapter subtree. No
# public surface until the first-slice implementation PR.
#
# Governing ADRs:
#   ADR-005 — integration adapter boundary
#             (docs/adr/ADR-005-integration-adapter-boundary.md)
#   ADR-013 — networking defaults and security
#             (docs/adr/ADR-013-networking-defaults-and-security.md)
#
# ADR-013 fixes the bind-scope default (localhost-only) and the
# rate-limit defaults the first-slice implementation must honor.
#
# See also docs/43-development-standards.md §12.1. All workspace lints
# (including unsafe_code = forbid, clippy::unwrap_used = deny,
# clippy::expect_used = deny) are inherited; no local relaxation.

[package]
name = "chromaticity-osc-adapter"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromaticity OSC integration adapter (ADR-013 defaults)."

[lints]
workspace = true

[dependencies]
workspace-hack = { version = "0.0.0", path = "../../workspace-hack" }

# chromaticity-observability owns the canonical `OscPacketOutcome`
# label-enum mirroring docs/31 §Scheme and Metric Catalog. The OSC
# adapter imports this enum so the in-adapter packet-outcome counter
# keys off the same vocabulary the slice-3 runtime-bus wiring will
# route through `MetricEvent::OscInboundPackets`. Slice-2 does NOT
# depend on any other observability surface (no `MetricSink`, no
# emitter types); adding those couplings is a slice-3 concern.
chromaticity-observability = { path = "../../engine/observability" }

# rosc 0.10 is the OSC 1.0 codec backing the Phase-1 slice-2 UDP
# packet-receive loop. License MIT OR Apache-2.0 (allow-listed in
# deny.toml). Slice-2 uses the decoder only; the encoder path
# (outbound OSC) remains slice-3+ scope.
rosc = "0.10"
